name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: xcodebuild -project DesktopPet.xcodeproj -scheme DesktopPet -configuration Debug build

      - name: Test
        run: xcodebuild -project DesktopPet.xcodeproj -scheme DesktopPet test
